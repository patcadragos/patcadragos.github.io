<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Until It Works</title>
<meta name="description" content="Ingenieurstudent, der Dinge von Null baut. Projekt für Projekt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e0e0e; --fg: #ffffff; --dim: #a3a3a3; --line: #2a2a2a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: 'Archivo', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
  }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 48px 20px 32px;
  }
  main { max-width: 560px; width: 100%; }
  h1 {
    font-family: 'Archivo Black', 'Archivo', sans-serif;
    font-weight: 900; font-size: clamp(2.1rem, 8vw, 3.4rem);
    letter-spacing: 0.01em; line-height: 1.05; margin: 0 0 18px;
    text-transform: uppercase;
  }
  .subtitle {
    font-size: clamp(1rem, 3.4vw, 1.15rem); font-weight: 500; color: var(--fg);
    margin: 0 0 22px; line-height: 1.5;
  }
  .desc {
    font-size: 0.98rem; color: var(--dim); line-height: 1.7;
    margin: 0 0 40px; max-width: 460px; margin-left: auto; margin-right: auto;
  }
  .links { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; margin: 0 auto; }
  .links a {
    display: block; padding: 14px 18px; border: 1.5px solid var(--fg); border-radius: 3px;
    color: var(--fg); text-decoration: none; font-weight: 700; font-size: 0.95rem;
    letter-spacing: 0.04em; text-transform: uppercase; transition: background .15s, color .15s;
  }
  .links a:hover, .links a:focus-visible { background: var(--fg); color: var(--bg); }
  footer { margin-top: 56px; font-size: 0.82rem; color: #6b6b6b; }
  footer a { color: #6b6b6b; text-decoration: underline; margin: 0 10px; }
  footer a:hover { color: var(--fg); }
  footer .sep { color: #3a3a3a; }
</style>
</head>
<body>
  <main>
    <h1>Build Until It Works</h1>
    <p class="subtitle">Ingenieurstudent, der Dinge von Null baut. Projekt für Projekt.</p>
    <p class="desc">
      Ein DIY/Engineering-Kanal, auf dem ich dokumentiere, wie ich Dinge von Grund auf baue —
      der ganze Prozess, inklusive aller Fehler und Umwege unterwegs.
    </p>
    <nav class="links">
      <a href="https://www.youtube.com/@BuildUntilItWorks" target="_blank" rel="noopener">YouTube</a>
      <a href="https://www.tiktok.com/@build.until.it.works" target="_blank" rel="noopener">TikTok</a>
      <a href="https://www.instagram.com/builduntilitworks/" target="_blank" rel="noopener">Instagram</a>
    </nav>
  </main>
  <footer>
    <a href="privacy.html">Privacy Policy</a><span class="sep">·</span><a href="terms.html">Terms of Service</a>
  </footer>
</body>
</html>
